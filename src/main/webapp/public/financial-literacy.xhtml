<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/templates/template.xhtml">

    <ui:define name="title">Finansal Okuryazarlık</ui:define>

    <ui:define name="metadata">
        <f:metadata>
        </f:metadata>
    </ui:define>

    <ui:define name="head">
        <style type="text/css">
        </style>
    </ui:define>

    <ui:define name="content">
        <div class="grid">
            <h:form id="updateForm" class="col">
                <div class="card">
                    <p:growl id="growl" showDetail="false" severity="info warn error">
                        <p:autoUpdate/>
                    </p:growl>

                    <h5 class="mt-0" style="font-weight: bold">Finansal okuryazarlık testi</h5>

                    <p:focus context="@next"/>

                    <ui:repeat value="#{financialLiteracyController.literacyQuestionList}"
                               var="question">
                        <p:panelGrid layout="flex"
                                     contentStyle="align-items: center;"
                                     contentStyleClass="ui-fluid"
                                     columnClasses="col-12 md:col-6 xl:col-6, col-12 md:col-6 xl:col-6"
                                     columns="2">
                            <p:outputLabel for="@next"
                                           value="#{question.value}"/>

                            <p:selectOneRadio required="true"
                                              requiredMessage="#{question.value} seçiniz."
                                              value="#{question.selectedAnswerId}">
                                <p:ajax process="@this" update="updateForm"/>
                                <f:selectItems var="onebutton"
                                               itemLabel="#{onebutton.value}"
                                               itemValue="#{onebutton.id}"
                                               value="#{question.questionOptionList}"/>
                            </p:selectOneRadio>
                        </p:panelGrid>
                    </ui:repeat>
                </div>

                <p:outputPanel style="display: flex; justify-content: space-between; flex-direction: row-reverse;">
                </p:outputPanel>
                <p>Sorunuz mu var? <a href="#">Buraya</a> basın ve bize bildirin.</p>
            </h:form>
        </div>

    </ui:define>
</ui:composition>
