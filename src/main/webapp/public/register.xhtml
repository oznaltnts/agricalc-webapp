<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/templates/template.xhtml">
             
    <ui:define name="title">Kayıt Ol</ui:define>

    <ui:define name="login">
        <f:event type="preRenderView"
                 listener="#{navigationController.redirectToHome()}"/>
    </ui:define>

    <ui:define name="content">
        <div class="grid">
            <div class="col">
                <h:form class="card">
                    <p:growl id="growl"
                             showDetail="true"
                             severity="info warn error">
                        <p:autoUpdate/>
                    </p:growl>

                    <p:focus context="@next"/>
                    <h5 class="mt-0" style="font-weight: bold">Sisteme kayıt olun</h5>

                    <p>Hesabınız var mı?
                        <a href="/login">
                            Giriş yapın
                        </a>
                    </p>

                    <p:divider align="center" type="dashed">
                        <b>Zorunlu</b>
                    </p:divider>
                    <p:panelGrid layout="flex"
                                 contentStyle="align-items: center;"
                                 contentStyleClass="ui-fluid"
                                 columnClasses="col-12 md:col-3, col-12 md:col-9"
                                 columns="2">
                        <p:outputLabel for="@next"
                                       value="Telefon numaranız"/>
                        <p:inputMask mask="(599) 999 99 99"
                                     required="true"
                                     requiredMessage="Telefon numaranızı uygun olarak olarak giriniz"
                                     validateMask="true"
                                     validatorMessage="Telefon numaranızı uygun olarak olarak giriniz"
                                     value="#{registerController.phone}"/>

                        <p:outputLabel for="@next"
                                       value="Şifreniz"/>
                        <p:password id="pwd1"
                                    required="true"
                                    requiredMessage="Şifreniz uygun olarak olarak giriniz"
                                    match="pwd2"
                                    feedback="true"
                                    toggleMask="true"
                                    label="Password 1"
                                    promptLabel="Lütfen şifre giriniz"
                                    weakLabel="Zayıf"
                                    goodLabel="Orta"
                                    strongLabel="Güçlü"
                                    value="#{registerController.password}">
                            <f:validateRegex pattern="#{registerController.regexPattern}" />
                        </p:password>

                        <p:outputLabel for="@next"
                                       value="Şifre tekrar"/>
                        <p:password id="pwd2"
                                    required="true"
                                    requiredMessage="Şifre tekrarını uygun olarak olarak giriniz"
                                    toggleMask="true"
                                    label="Password 2"
                                    value="#{registerController.password}"/>
                    </p:panelGrid>

                    <p:divider align="center" type="dashed">
                        <b>İsteğe bağlı</b>
                    </p:divider>
                    <p:panelGrid layout="flex"
                                 contentStyle="align-items: center;"
                                 contentStyleClass="ui-fluid"
                                 columnClasses="col-12 md:col-3, col-12 md:col-9"
                                 columns="2">

                    </p:panelGrid>

                    <p:outputPanel style="display: flex; justify-content: space-between;">
                        <p:outputLabel/>
                        <p:commandButton value="Kayıt ol"
                                         icon="pi pi-check"
                                         process="@form"
                                         update="@form"
                                         action="#{registerController.register}"
                                         validateClient="true"
                                         styleClass="m-2" />
                    </p:outputPanel>
                </h:form>
            </div>
        </div>
        <div class="grid">
            <div class="col">
                <br/>
                <p>Sorunuz mu var? <a href="#">Buraya</a> basın ve bize bildirin.</p>
            </div>
        </div>
    </ui:define>
</ui:composition>
