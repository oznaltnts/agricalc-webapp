<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/templates/template.xhtml">

    <ui:define name="title">Hayvan türü yönetimi</ui:define>

    <ui:define name="content">
        <div class="grid">
            <div class="col">
                <h:form id="dairyCowListForm"
                        class="card">
                    <h5 class="mt-0" style="font-weight: bold">Hayvan türü yönetimi</h5>

                    <p:growl showDetail="true"
                             severity="info warn">
                        <p:autoUpdate/>
                    </p:growl>

                    <p:dataTable value="#{cowManagementController.dairyCowList}"
                                 var="dairyCow"
                                 reflow="true"
                                 stripedRows="true"
                                 size="small">
                        <p:column headerText="Yem ismi">
                            <h:outputText value="#{dairyCow.name}"/>
                        </p:column>

                        <p:column headerText="Statü">
                            <h:outputText value="#{msg[dairyCow.status]}"/>
                        </p:column>
                        <p:column headerText="Yönet" style="width: 8rem; text-align: center;">
                            <p:commandButton action="#{cowManagementController.editDairyCow(dairyCow)}"
                                             update="cowEditForm"
                                             disabled="#{dairyCow.status eq 'DELETED'}"
                                             value="Düzenle"/>
                        </p:column>
                    </p:dataTable>

                    <p:commandButton action="#{cowManagementController.addNewDairyCow}"
                                     styleClass="m-1"
                                     process="@this"
                                     update="cowEditForm"
                                     value="Yeni tür ekle"/>
                </h:form>
            </div>
        </div>
        <div class="grid">
            <div class="col">
                <h:form id="cowEditForm"
                        style="visibility: #{cowManagementController.selectedDairyCow eq null ? 'hidden' : 'visible'}"
                        class="card">
                    <h5 class="mt-0" style="font-weight: bold">Hayvan türü yönetimi</h5>

                    <p:panelGrid layout="flex"
                                 rendered="#{cowManagementController.selectedDairyCow ne null}"
                                 columnClasses="col-3, col-9"
                                 columns="2">

                        <p:outputLabel for="cowStatus" value="Statü"/>
                        <p:outputPanel>
                            <p:selectOneButton id="cowStatus"
                                               unselectable="false"
                                               required="true"
                                               requiredMessage="bbbb"
                                               value="#{cowManagementController.selectedDairyCow.status}">
                                <f:selectItems value="#{cowManagementController.statuses}"
                                               var="status"
                                               itemValue="#{status}"
                                               itemLabel="#{msg[status]}"/>
                            </p:selectOneButton>
                            <p:message for="@previous"/>
                        </p:outputPanel>


                        <p:outputLabel for="nameInput" value="İsmi"/>
                        <p:outputPanel>
                            <p:inputText id="nameInput"
                                         value="#{cowManagementController.selectedDairyCow.name}"
                                         requiredMessage="cccc"
                                         required="true"/>
                            <p:message for="@previous"/>
                        </p:outputPanel>
                    </p:panelGrid>

                    <p:commandButton value="Vazgeç"
                                     process="@this"
                                     update="@form"
                                     styleClass="m-1"
                                     resetValues="true"
                                     action="#{cowManagementController.setSelectedDairyCow(null)}"/>

                    <p:commandButton value="Kaydet"
                                     process="@form"
                                     update="@form dairyCowListForm"
                                     styleClass="m-1"
                                     validateClient="true"
                                     action="#{cowManagementController.saveSelectedDairyCow}"/>
                </h:form>
                <br/>
                <p>Sorunuz mu var? <a href="#">Buraya</a> basın ve bize bildirin.</p>
            </div>
        </div>
    </ui:define>
</ui:composition>
