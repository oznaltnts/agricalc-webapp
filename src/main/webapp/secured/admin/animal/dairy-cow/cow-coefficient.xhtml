<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/templates/template.xhtml">

    <ui:define name="title">Hayvan katsayı yönetimi</ui:define>

    <ui:define name="content">
        <div class="grid">
            <div class="col">
                <h:form id="coefficientListForm"
                        class="card">
                    <h5 class="mt-0" style="font-weight: bold">Hayvan katsayı yönetimi</h5>

                    <p:growl showDetail="true"
                             severity="info warn">
                        <p:autoUpdate/>
                    </p:growl>

                    <p:dataTable value="#{coefficientManagementController.coefficientList}"
                                 var="coefficient"
                                 reflow="true"
                                 stripedRows="true"
                                 size="small">
                        <p:column headerText="Katsayı">
                            <h:outputText value="#{msg[coefficient.cowType]}"/>
                        </p:column>
                        <p:column headerText="Değeri">
                            <h:outputText value="#{coefficient.value}"/>
                        </p:column>
                        <p:column headerText="Yönet" style="width: 8rem; text-align: center;">
                            <p:commandButton action="#{coefficientManagementController.editCoefficient(coefficient)}"
                                             update="coefficientEditForm"
                                             value="Düzenle"/>
                        </p:column>

                    </p:dataTable>

                </h:form>
            </div>
        </div>
        <div class="grid">
            <div class="col">
                <h:form id="coefficientEditForm"
                        style="visibility: #{coefficientManagementController.selectedCoefficient eq null ? 'hidden' : 'visible'}"
                        class="card">
                    <h5 class="mt-0" style="font-weight: bold">Hayvan katsayı yönetimi</h5>

                    <p:panelGrid layout="flex"
                                 rendered="#{coefficientManagementController.selectedCoefficient ne null}"
                                 columnClasses="col-3, col-9"
                                 columns="2">
                        <p:outputLabel for="@next" value="Katsayı:"/>
                        <p:outputLabel value="#{msg[coefficientManagementController.selectedCoefficient.cowType]}"/>

                        <p:outputLabel for="coefValue" value="Değer:"/>
                        <p:outputPanel>
                            <p:inputNumber id="coefValue"
                                           value="#{coefficientManagementController.selectedCoefficient.value}"
                                           minValue="0"
                                           maxValue="1"
                                           requiredMessage="cccc"
                                           required="true"/>
                            <p:message for="@previous"/>
                        </p:outputPanel>
                    </p:panelGrid>

                    <p:commandButton value="Vazgeç"
                                     process="@this"
                                     update="@form"
                                     styleClass="m-1"
                                     resetValues="true"
                                     action="#{coefficientManagementController.setSelectedCoefficient(null)}"/>

                    <p:commandButton value="Kaydet"
                                     process="@form"
                                     update="@form coefficientListForm"
                                     styleClass="m-1"
                                     validateClient="true"
                                     action="#{coefficientManagementController.saveSelectedDairyCow}"/>

                </h:form>
                <br/>
                <p>Sorunuz mu var? <a href="#">Buraya</a> basın ve bize bildirin.</p>
            </div>
        </div>
    </ui:define>
</ui:composition>
