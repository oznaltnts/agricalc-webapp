<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/templates/template.xhtml">

    <ui:define name="title">Yem yönetimi</ui:define>

    <ui:define name="content">
        <div class="grid">
            <div class="col">
                <h:form id="feedListForm"
                        class="card">
                    <h5 class="mt-0" style="font-weight: bold">Hayvan yemi yönetimi</h5>

                    <p:growl showDetail="true"
                             severity="info warn">
                        <p:autoUpdate/>
                    </p:growl>

                    <p:dataTable var="feedTable"
                                 size="small"
                                 stripedRows="true"
                                 value="#{feedManagementController.feedList}">

                        <p:column headerText="Yem tipi" groupRow="true">
                            <h6>#{msg[feedTable.feedCategory]} - #{msg[feedTable.feedType]}</h6>
                        </p:column>

                        <p:column headerText="Statü">
                            <h6>#{msg[feedTable.status]}</h6>
                        </p:column>
                        <p:column headerText="Yem ismi">
                            <h:outputText value="#{feedTable.name}"/>
                        </p:column>
                        <p:column headerText="Yönet">
                            <p:commandButton action="#{feedManagementController.editFeed(feedTable)}"
                                             update="feedEditForm"
                                             disabled="#{feedTable.status eq 'DELETED'}"
                                             value="Düzenle"/>
                        </p:column>
                    </p:dataTable>

                    <p:commandButton action="#{feedManagementController.addNewFeedToCategory}"
                                     styleClass="m-1"
                                     process="@this"
                                     update="feedEditForm"
                                     value="Yeni yem ekle"/>
                </h:form>
            </div>
        </div>
        <div class="grid">
            <div class="col">
                <h:form id="feedEditForm"
                        style="visibility: #{feedManagementController.selectedFeed eq null ? 'hidden' : 'visible'}"
                        class="card">
                    <h5 class="mt-0" style="font-weight: bold">Hayvan yemi güncelleme</h5>

                    <p:panelGrid layout="flex"
                                 rendered="#{feedManagementController.selectedFeed ne null}"
                                 columnClasses="col-3, col-9"
                                 columns="2">
                        <p:outputLabel for="feedCate" value="Kategory"/>
                        <p:outputPanel>
                            <p:selectOneButton id="feedCate"
                                               unselectable="false"
                                               required="true"
                                               requiredMessage="1111"
                                               value="#{feedManagementController.selectedFeed.feedCategory}">
                                <p:ajax update="subTypes"/>
                                <f:selectItems value="#{feedManagementController.feedCategories}"
                                               var="feedCategory"
                                               itemLabel="#{msg[feedCategory]}"
                                               itemValue="#{feedCategory}"/>
                            </p:selectOneButton>
                            <p:message for="@previous"/>
                        </p:outputPanel>

                        <p:outputLabel for="subTypes" value="Tip"/>
                        <p:outputPanel>
                            <p:selectOneButton id="subTypes"
                                               unselectable="false"
                                               required="true"
                                               requiredMessage="aaaa"
                                               value="#{feedManagementController.selectedFeed.feedType}">
                                <f:selectItems var="feedType"
                                               value="#{feedManagementController.selectedFeed.feedCategory.subTypes}"
                                               itemLabel="#{msg[feedType]}"
                                               itemValue="#{feedType}"/>
                            </p:selectOneButton>
                            <p:message for="@previous"/>
                        </p:outputPanel>

                        <p:outputLabel for="feedStatus" value="Statü"/>
                        <p:outputPanel>
                            <p:selectOneButton id="feedStatus"
                                               unselectable="false"
                                               required="true"
                                               requiredMessage="bbbb"
                                               value="#{feedManagementController.selectedFeed.status}">
                                <f:selectItems value="#{feedManagementController.statuses}"
                                               var="status"
                                               itemValue="#{status}"
                                               itemLabel="#{msg[status]}"/>
                            </p:selectOneButton>
                            <p:message for="@previous"/>
                        </p:outputPanel>

                        <p:outputLabel for="nameInput" value="İsmi"/>
                        <p:outputPanel>
                            <p:inputText id="nameInput"
                                         value="#{feedManagementController.selectedFeed.name}"
                                         requiredMessage="cccc"
                                         required="true"/>
                            <p:message for="@previous"/>
                        </p:outputPanel>
                    </p:panelGrid>

                    <p:commandButton value="Vazgeç"
                                     process="@this"
                                     update="@form"
                                     styleClass="m-1"
                                     resetValues="true"
                                     action="#{feedManagementController.setSelectedFeed(null)}"/>

                    <p:commandButton value="Kaydet"
                                     process="@form"
                                     update="@form feedListForm"
                                     styleClass="m-1"
                                     validateClient="true"
                                     action="#{feedManagementController.saveSelectedFeed}"/>
                </h:form>
                <br/>
                <p>Sorunuz mu var? <a href="#">Buraya</a> basın ve bize bildirin.</p>
            </div>
        </div>
    </ui:define>
</ui:composition>
