<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/templates/template.xhtml">

    <ui:define name="title">Hayvancılık Üretimleri</ui:define>

    <ui:define name="content">
        <div class="grid">
            <div class="col">
                <h:form class="card">
                    <h2>Hayvancılık Üretimleri</h2>

                    <p:growl showDetail="true"
                             severity="info warn">
                        <p:autoUpdate/>
                    </p:growl>

                    <p:tabView cache="false"
                               dynamic="true"
                               widgetVar="feedWidgetVar"
                               focusOnError="true">
                        <p:tab title="Büyükbaş Hayvancılık">
                            <p:dataTable value="#{animalDashboardController.userDairyCowList}"
                                         var="userDairy">
                                <p:column headerText="id">
                                    <h:outputText value="#{userDairy.id}"/>
                                </p:column>
                                <p:column headerText="durum">
                                    <h:outputText value="#{msg[userDairy.status]}"/>
                                </p:column>

                                <p:column style="width: 80px;text-align: right">

                                    <p:button value="Detay"
                                              styleClass="mr-2" iconPos="right"
                                              outcome="/secured/animal/dairy-cow?dairyCowId=#{userDairy.id}"
                                              icon="fa-solid fa-angles-right"/>
                                </p:column>
                            </p:dataTable>
                        </p:tab>
                    </p:tabView>
                </h:form>
            </div>
        </div>
        <div class="grid">
            <div class="col">
                <h:form class="card">
                </h:form>
                <br/>
                <p>Sorunuz mu var? <a href="#">Buraya</a> basın ve bize bildirin.</p>
            </div>
        </div>
    </ui:define>
</ui:composition>
