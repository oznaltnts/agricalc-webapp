<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/templates/template.xhtml">

    <ui:define name="title">Büyükbaş Süt Üretimi</ui:define>

    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="barnId"
                         value="#{dairyCowExpenseController.barnId}"/>
            <f:viewAction action="#{dairyCowExpenseController.fillDataTableValues}"/>
        </f:metadata>
    </ui:define>

    <ui:define name="content">
        <div class="grid">
            <div class="col">
                <div class="card">
                    <p:steps activeIndex="3">
                        <p:menuitem value="Ahırlar"/>
                        <p:menuitem value="Hayvanlar"/>
                        <p:menuitem value="Yemler"/>
                        <p:menuitem value="Giderler"/>
                        <p:menuitem value="Confirmation"/>
                    </p:steps>
                </div>
            </div>
        </div>
        <div class="grid">
            <div class="col">
                <h:form id="expenseListForm" class="card">
                    <h5 class="mt-0">İşletme Maliyeti</h5>

                    <p:growl showDetail="true"
                             severity="info warn">
                        <p:autoUpdate/>
                    </p:growl>

                    <p:outputPanel style="display: flex; justify-content: end;">
                        <p:button value="Büyükbaş süt yemleri"
                                  styleClass="m-1"
                                  iconPos="left"
                                  href="/secured/animal/dairy-cow-feed"
                                  icon="fa-solid fa-angles-left">
                            <f:param name="barnId"
                                     value="#{dairyCowExpenseController.barnId}"/>
                        </p:button>
                        <p:button value="Büyükbaş süt işletme gelirleri"
                                  styleClass="m-1"
                                  iconPos="right"
                                  disabled="true"
                                  href="/secured/animal/dairy-cow-cost"
                                  icon="fa-solid fa-angles-right">
                            <f:param name="barnId"
                                     value="#{dairyCowExpenseController.barnId}"/>
                        </p:button>
                    </p:outputPanel>
                </h:form>
            </div>
        </div>
        <div class="grid">
            <div class="col">
                <h:form id="expenseEditForm"
                        styleClass="card">
                    <h5 class="mt-0">Ekle/Düzenle</h5>

                </h:form>
                <br/>
                <p>Sorunuz mu var? <a href="#">Buraya</a> basın ve bize bildirin.</p>
            </div>
        </div>
    </ui:define>
</ui:composition>
