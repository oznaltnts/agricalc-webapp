<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/templates/template.xhtml">

    <ui:define name="title">Büyükbaş Süt Üretimi</ui:define>

    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="barnId"
                         value="#{dairyCowFeedRasyonController.barnId}"/>
            <f:viewAction action="#{dairyCowFeedRasyonController.fillDataTableValues}"/>
        </f:metadata>
    </ui:define>

    <ui:define name="content">
        <div class="grid">
            <div class="col">
                <div class="card">
                    <p:steps activeIndex="3">
                        <p:menuitem value="Ahırlar"/>
                        <p:menuitem value="Hayvanlar"/>
                        <p:menuitem value="Yemler"/>
                        <p:menuitem value="Yem rasyonu"/>
                        <p:menuitem value="Giderler"/>
                        <p:menuitem value="Gelirler"/>
                        <p:menuitem value="Sonuçlar"/>
                    </p:steps>
                </div>
            </div>
        </div>
        <div class="grid">
            <div class="col">
                <h:form id="rasyonListForm"
                        class="card">
                    <h5 class="mt-0" style="font-weight: bold">Büyükbaş süt yem rasyon</h5>

                    <p:growl showDetail="true"
                             severity="info warn">
                        <p:autoUpdate/>
                    </p:growl>

                    <p:focus context="@next"/>

                    <p:dataTable var="feedTable"
                                 reflow="true"
                                 stripedRows="true"
                                 size="small"
                                 value="#{dairyCowFeedRasyonController.dairyCowFeedViewList}">
                        <p:column headerText="Kategori" groupRow="true">
                            <h:outputText style="font-weight: bold" value="#{msg[feedTable.feed.feedCategory]}"/>
                        </p:column>
                        <p:column headerText="Yem tipi" groupRow="true">
                            <h:outputText value="#{msg[feedTable.feed.feedType]}"/>
                        </p:column>
                        <p:column headerText="Yem ismi">
                            <h:outputText value="#{feedTable.feed.name}"/>
                        </p:column>
                        
                        <p:column headerText="Laktasyon döneminde günlük ortalama bir hayvana verilen miktar (Kg/Hayvan) *">
                            <p:inputNumber id="lactationInputNumber"
                                           placeholder="feedTableInputNumber inputNumber placeholder"
                                           value="#{feedTable.lactationRasyon}"
                                           required="#{feedTable.lactationRasyon eq null and feedTable.roughageRasyon eq null}"
                                           requiredMessage="lactationInputNumber inputNumber requiredMessage"
                                           maxValue="999999999999"
                                           minValue="0">
                                <p:ajax update="lactationInputNumber roughageInputNumber"/>
                            </p:inputNumber>
                        </p:column>

                        <p:column headerText="Kuru dödemde günlük ortalama bir hayvana verilen miktar (Kg/Hayvan) *">
                            <p:inputNumber id="roughageInputNumber"
                                           placeholder="feedTableInputNumber inputNumber placeholder"
                                           value="#{feedTable.roughageRasyon}"
                                           required="#{feedTable.lactationRasyon eq null and feedTable.roughageRasyon eq null}"
                                           requiredMessage="roughageInputNumber inputNumber requiredMessage"
                                           maxValue="999999999999"
                                           minValue="0">
                                <p:ajax update="lactationInputNumber roughageInputNumber"/>
                            </p:inputNumber>
                        </p:column>
                    </p:dataTable>
                    <p:messages showDetail="true">
                        <p:autoUpdate/>
                    </p:messages>
                </h:form>
            </div>
        </div>
        <div class="grid">
            <div class="col">
                <h:form style="display: flex; justify-content: space-between; flex-direction: row-reverse;">
                    <p:commandButton value="Büyükbaş süt işletme giderleri"
                                     process="rasyonListForm"
                                     update="rasyonListForm"
                                     styleClass="m-1"
                                     validateClient="true"
                                     iconPos="right"
                                     action="#{dairyCowFeedRasyonController.nextSaveFeedRasyon}"
                                     icon="fa-solid fa-angles-right"/>
                    <p:commandButton value="Büyükbaş süt yemleri"
                                     process="rasyonListForm"
                                     update="rasyonListForm"
                                     styleClass="m-1"
                                     validateClient="true"
                                     iconPos="left"
                                     action="#{dairyCowFeedRasyonController.backSaveFeedRasyon}"
                                     icon="fa-solid fa-angles-left"/>
                </h:form>
                <br/>
                <p>Sorunuz mu var? <a href="#">Buraya</a> basın ve bize bildirin.</p>
            </div>
        </div>
    </ui:define>
</ui:composition>
