<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/templates/template.xhtml">

    <ui:define name="title">Büyükbaş Süt Üretimi</ui:define>

    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam id="dairyCowId"
                         name="dairyCowId"
                         value="#{dairyCowFeedController.dairyCowId}"
                         requiredMessage="aaaa"
                         required="true"/>
            <f:viewAction action="#{dairyCowFeedController.fillDataTableValues}"/>
            <f:event type="postValidate"
                     listener="#{dairyCowFeedController.redirectIfValidationFailed}" />
        </f:metadata>
    </ui:define>

    <ui:define name="content">
        <div class="grid">
            <div class="col">
                <h:form id="feedListForm" class="card">
                    <h5 class="mt-0">Büyükbaş süt yemleri</h5>

                    <p:growl showDetail="true"
                             severity="info warn">
                        <p:autoUpdate/>
                    </p:growl>

                    <p:tabView cache="false"
                               dynamic="true" activeIndex="-1"
                               widgetVar="feedWidgetVar"
                               value="#{dairyCowFeedController.feedCategories}"
                               var="category"
                               focusOnError="true">
                        <p:ajax event="tabChange"
                                update="feedEditForm"
                                listener="#{dairyCowFeedController.setSelectedFeedView(null)}"/>
                        <p:tab title="#{msg[category.name()]}">
                            <p:dataTable var="feedTable"
                                         stripedRows="true"
                                         value="#{dairyCowFeedController.getDataTableList(category)}">
                                <p:column headerText="Yönet">
                                    <p:commandButton update="feedEditForm"
                                                     value="Düzenle"
                                                     action="#{dairyCowFeedController.editUserFeed(feedTable)}"/>
                                </p:column>
                                <p:column headerText="Yem tipi" groupRow="true">
                                    <h6>#{msg[feedTable.feed.feedType]}</h6>
                                </p:column>
                                <p:column headerText="Yem ismi">
                                    <h:outputText value="#{feedTable.feed.name}"/>
                                </p:column>

                                <p:column headerText="Kilogram miktarı (kg)">
                                    <h:outputText value="#{feedTable.amountKg}"/>
                                </p:column>
                                <p:column headerText="Alış tarihi">
                                    <h:outputText value="#{feedTable.buyingDate}"/>
                                </p:column>
                                <p:column headerText="Kilogram fiyatı (TL/kg)">
                                    <h:outputText value="#{feedTable.buyingPriceKg}"/>
                                </p:column>
                            </p:dataTable>

                            <p:commandButton action="#{dairyCowFeedController.addNewFeedView}"
                                             styleClass="m-1"
                                             process="@this"
                                             update="feedEditForm"
                                             value="Yeni #{msg[category.name()]} ekle"/>
                        </p:tab>
                    </p:tabView>
                </h:form>
            </div>
        </div>
        <div class="grid">
            <div class="col">
                <h:form id="feedEditForm"
                        style="visibility: #{dairyCowFeedController.selectedFeedView eq null ? 'hidden' : 'visible'}"
                        styleClass="card">
                    <h5 class="mt-0">Ekle/Düzenle</h5>

                    <p:tabView>
                        <p:tab title="Ekle/Düzenle">
                            <p:panelGrid layout="flex"
                                         columnClasses="col-3, col-9"
                                         columns="2">
                                <p:outputLabel for="feedSelect" value="Yem seçimi"/>
                                <p:outputPanel>
                                    <p:selectOneMenu id="feedSelect"
                                                     disabled="#{dairyCowFeedController.selectedFeedView.userFeedId ne null}"
                                                     required="#{dairyCowFeedController.selectedFeedView.userFeedId eq null}"
                                                     requiredMessage="feedSelect selectOneMenu required"
                                                     value="#{dairyCowFeedController.selectedFeedId}">
                                        <p:ajax process="@this"/>
                                        <f:selectItem itemLabel="seçiniz" itemValue=""/>
                                        <f:selectItems value="#{dairyCowFeedController.feedList}"
                                                       var="feedOption"/>
                                    </p:selectOneMenu>
                                    <p:message for="@previous"/>
                                </p:outputPanel>

                                <p:outputLabel for="feedAmount" value="Kilogram miktarı (kg)"/>
                                <p:outputPanel>
                                    <p:inputNumber id="feedAmount"
                                                   required="true"
                                                   requiredMessage="feedAmount inputNumber required"
                                                   value="#{dairyCowFeedController.selectedFeedView.amountKg}"
                                                   minValue="0"/>
                                    <p:message for="@previous"/>
                                </p:outputPanel>

                                <p:outputLabel for="feedDate" value="Alış tarihi"/>
                                <p:outputPanel>
                                    <p:datePicker id="feedDate"
                                                  required="true"
                                                  requiredMessage="feedDate datePicker required"
                                                  value="#{dairyCowFeedController.selectedFeedView.buyingDate}"
                                                  showTime="false"
                                                  pattern="dd MMMM yyyy"
                                                  mindate="#{dairyCowFeedController.today.minusYears(1)}"
                                                  maxdate="#{dairyCowFeedController.today.plusMonths(1)}"/>
                                    <p:message for="@previous"/>
                                </p:outputPanel>

                                <p:outputLabel for="feedPrice" value="Kilogram fiyatı (TL/kg)"/>
                                <p:outputPanel>
                                    <p:inputNumber id="feedPrice"
                                                   required="true"
                                                   requiredMessage="feedPrice inputNumber required"
                                                   value="#{dairyCowFeedController.selectedFeedView.buyingPriceKg}"
                                                   minValue="0"/>
                                    <p:message for="@previous"/>
                                </p:outputPanel>
                            </p:panelGrid>

                            <p:commandButton value="Vazgeç"
                                             process="@this"
                                             update="@form"
                                             styleClass="m-1"
                                             resetValues="true"
                                             action="#{dairyCowFeedController.setSelectedFeedView(null)}"/>
                            <p:commandButton value="Kaydet"
                                             process="@form"
                                             update="@form feedListForm"
                                             styleClass="m-1"
                                             validateClient="true"
                                             action="#{dairyCowFeedController.saveSelectedFeed}"/>

                        </p:tab>
                    </p:tabView>
                </h:form>
                <br/>
                <p>Sorunuz mu var? <a href="#">Buraya</a> basın ve bize bildirin.</p>
            </div>
        </div>
    </ui:define>
</ui:composition>
