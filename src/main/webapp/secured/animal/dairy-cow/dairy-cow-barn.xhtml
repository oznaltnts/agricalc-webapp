<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/templates/template.xhtml">

    <ui:define name="title">Büyükbaş Süt Üretimi</ui:define>

    <ui:define name="metadata">
    </ui:define>

    <ui:define name="content">
        <div class="grid">
            <div class="col">
                <div class="card">
                    <p:steps activeIndex="0">
                        <p:menuitem value="Ahırlar"/>
                        <p:menuitem value="Hayvanlar"/>
                        <p:menuitem value="Yemler"/>
                        <p:menuitem value="Yem rasyonu"/>
                        <p:menuitem value="Giderler"/>
                        <p:menuitem value="Gelirler"/>
                        <p:menuitem value="Sonuçlar"/>
                    </p:steps>
                </div>
            </div>
        </div>
        <div class="grid">
            <div class="col">
                <h:form id="barnListForm"
                        class="card">
                    <h5 class="mt-0" style="font-weight: bold">Büyükbaş süt ahırları</h5>

                    <p:growl showDetail="true"
                             severity="info warn">
                        <p:autoUpdate/>
                    </p:growl>

                    <p:dataTable var="dairyCowBarn"
                                 stripedRows="true"
                                 size="small"
                                 reflow="true"
                                 value="#{dairyCowBarnController.dairyCowBarnViews}">
                        <p:column headerText="Hayvan ırkı">
                            <h:outputText value="#{dairyCowBarn.dairyCowName}"/>
                        </p:column>
                        <p:column headerText="Ahır kapasitesi" responsivePriority="2">
                            <h:outputText value="#{dairyCowBarn.barnCapacity}"/>
                        </p:column>
                        <p:column headerText="Sağmal kapasite" responsivePriority="3">
                            <h:outputText value="#{dairyCowBarn.milkingCapacity}"/>
                        </p:column>
                        <p:column headerText="Tesis Fiyatı" responsivePriority="3">
                            <h:outputText value="#{dairyCowBarn.barnPrice}"/>
                        </p:column>
                        <p:column headerText="Doğum oranı" responsivePriority="4">
                            <h:outputText value="#{dairyCowBarn.unknownBirthRate ? 'Bilmiyorum' : dairyCowBarn.birthRate}"/>
                        </p:column>
                        <p:column headerText="Ölüm oranı" responsivePriority="4">
                            <h:outputText value="#{dairyCowBarn.unknownDeathRate ? 'Bilmiyorum' : dairyCowBarn.deathRate}"/>
                        </p:column>
                        <p:column headerText="Suni tohumlama" responsivePriority="5">
                            <h:outputText value="#{dairyCowBarn.unknownInseminationRate ? 'Bilmiyorum' : dairyCowBarn.inseminationRate}"/>
                        </p:column>
                        <p:column headerText="Hayvan süt verimi" responsivePriority="5">
                            <h:outputText value="#{dairyCowBarn.unknownMilkYield ? 'Bilmiyorum' : dairyCowBarn.milkYield}"/>
                        </p:column>
                        <p:column headerText="Laktasyon süresi" responsivePriority="5">
                            <h:outputText value="#{dairyCowBarn.lactationPeriod}"/>
                        </p:column>
                        <p:column style="width: 200px; text-align: center" headerText="Yönet" >
                            <p:commandButton update="barnEditForm"
                                             styleClass="m-1"
                                             value="Düzenle"
                                             action="#{dairyCowBarnController.editBarn(dairyCowBarn)}"/>
                            <p:button value="Hayvanlar"
                                      styleClass="m-1"
                                      iconPos="right"
                                      href="/secured/animal/dairy-cow/count"
                                      icon="fa-solid fa-angles-right">
                                <f:param name="barnId"
                                         value="#{dairyCowBarn.barnId}"/>
                            </p:button>
                        </p:column>
                    </p:dataTable>
                    <p:outputPanel style="display: flex;">
                        <p:commandButton action="#{dairyCowBarnController.addNewBarnView}"
                                         styleClass="m-1"
                                         process="@this"
                                         update="barnEditForm"
                                         value="Yeni ahır ekle"/>
                    </p:outputPanel>
                </h:form>
            </div>
        </div>
        <div class="grid">
            <div class="col">
                <h:form id="barnEditForm"
                        style="visibility: #{dairyCowBarnController.selectedBarnView eq null ? 'hidden' : 'visible'}; height: #{dairyCowBarnController.selectedBarnView eq null ? '0' : 'unset'}"
                        styleClass="card">
                    <h5 class="mt-0" style="font-weight: bold">Ekle/Düzenle</h5>

                    <p:messages showDetail="true" globalOnly="true" />

                    <p:panelGrid layout="flex"
                                 rendered="#{dairyCowBarnController.selectedBarnView ne null}"
                                 columnClasses="col-3 text-right, col-9"
                                 columns="2">
                        <p:outputLabel for="barnCapacity" value="Ahır kapasitesi: "/>
                        <p:outputPanel>
                            <p:inputNumber id="barnCapacity"
                                           value="#{dairyCowBarnController.selectedBarnView.barnCapacity}"
                                           minValue="1"
                                           decimalPlaces="0"
                                           required="true"
                                           requiredMessage="barnCapacity inputNumber requiredMessage"/>
                            <p:message for="@previous"/>
                        </p:outputPanel>

                        <p:outputLabel for="milkingCapacity" value="Sağmal inek kapasitesi: "/>
                        <p:outputPanel>
                            <p:inputNumber id="milkingCapacity"
                                           value="#{dairyCowBarnController.selectedBarnView.milkingCapacity}"
                                           minValue="1"
                                           placeholder="Ahır kapasitesinin %90'nı geçemez."
                                           decimalPlaces="0"
                                           required="true"
                                           requiredMessage="milkingCapacity inputNumber requiredMessage"/>
                            <p:message for="@previous"/>
                        </p:outputPanel>

                        <p:outputLabel for="dairyCowId" value="Hayvan ırkı: "/>
                        <p:outputPanel>
                            <p:selectOneMenu id="dairyCowId"
                                             value="#{dairyCowBarnController.selectedBarnView.selectedDairyCowId}"
                                             required="true"
                                             requiredMessage="dairyCowId selectOneMenu requiredMessage">
                                <f:selectItem itemLabel="seçiniz" itemValue=""/>
                                <f:selectItems value="#{dairyCowBarnController.dairyCowList}"
                                               itemValue="#{dairyCow.id}"
                                               itemLabel="#{dairyCow.name}"
                                               var="dairyCow"/>
                            </p:selectOneMenu>
                            <p:message for="@previous"/>
                        </p:outputPanel>

                        <p:outputLabel for="barnPrice" value="Süt İşletmesi Ahir Tipinden Sifir Tesis Fiyatı: "/>
                        <p:outputPanel styleClass="ui-inputgroup">
                            <p:inputNumber id="barnPrice"
                                           value="#{dairyCowBarnController.selectedBarnView.barnPrice}"
                                           minValue="0"/>
                        </p:outputPanel>

                        <p:outputLabel for="birthRate" value="İşletmenin ortalama doğum oranı (%): "/>
                        <p:outputPanel styleClass="ui-inputgroup">
                            <p:inputNumber id="birthRate"
                                           value="#{dairyCowBarnController.selectedBarnView.birthRate}"
                                           rendered="#{!dairyCowBarnController.selectedBarnView.unknownBirthRate}"
                                           maxValue="100"
                                           minValue="0"/>
                            <p:selectBooleanButton onLabel="Biliyorum"
                                                   offLabel="Bilmiyorum"
                                                   value="#{dairyCowBarnController.selectedBarnView.unknownBirthRate}">
                                <p:ajax update="@parent"/>
                            </p:selectBooleanButton>
                        </p:outputPanel>


                        <p:outputLabel for="deathRate" value="İşletmenin ortalama ölüm oranı (%): "/>
                        <p:outputPanel styleClass="ui-inputgroup">
                            <p:inputNumber id="deathRate"
                                           value="#{dairyCowBarnController.selectedBarnView.deathRate}"
                                           rendered="#{!dairyCowBarnController.selectedBarnView.unknownDeathRate}"
                                           maxValue="100"
                                           minValue="0"/>
                            <p:selectBooleanButton onLabel="Biliyorum"
                                                   offLabel="Bilmiyorum"
                                                   value="#{dairyCowBarnController.selectedBarnView.unknownDeathRate}">
                                <p:ajax update="@parent"/>
                            </p:selectBooleanButton>
                        </p:outputPanel>

                        <p:outputLabel for="inseminationRate" value="İşletmenin ortalama suni tohumlama sayısı: "/>
                        <p:outputPanel styleClass="ui-inputgroup">
                            <p:inputNumber id="inseminationRate"
                                           value="#{dairyCowBarnController.selectedBarnView.inseminationRate}"
                                           rendered="#{!dairyCowBarnController.selectedBarnView.unknownInseminationRate}"
                                           maxValue="100"
                                           minValue="0"/>
                            <p:selectBooleanButton onLabel="Biliyorum"
                                                   offLabel="Bilmiyorum"
                                                   value="#{dairyCowBarnController.selectedBarnView.unknownInseminationRate}">
                                <p:ajax update="@parent"/>
                            </p:selectBooleanButton>
                        </p:outputPanel>

                        <p:outputLabel for="milkYield" value="Yıllık ortama hayvan başına süt verimi: "/>
                        <p:outputPanel styleClass="ui-inputgroup">
                            <p:inputNumber id="milkYield"
                                           value="#{dairyCowBarnController.selectedBarnView.milkYield}"
                                           rendered="#{!dairyCowBarnController.selectedBarnView.unknownMilkYield}"
                                           maxValue="100"
                                           minValue="0"/>
                            <p:selectBooleanButton onLabel="Biliyorum"
                                                   offLabel="Bilmiyorum"
                                                   value="#{dairyCowBarnController.selectedBarnView.unknownMilkYield}">
                                <p:ajax update="@parent"/>
                            </p:selectBooleanButton>
                        </p:outputPanel>

                        <p:outputLabel for="lactationPeriod" value="Ortalama Laktasyon (Süt alma) süresi: "/>
                        <p:outputPanel>
                            <p:inputNumber id="lactationPeriod"
                                           value="#{dairyCowBarnController.selectedBarnView.lactationPeriod}"
                                           minValue="1"
                                           decimalPlaces="0"
                                           required="true"
                                           symbol=" gün / 1 yıl" symbolPosition="s"
                                           requiredMessage="lactationPeriod inputNumber requiredMessage"/>
                            <p:message for="@previous"/>
                        </p:outputPanel>

                        <p:outputPanel/>
                        <p:outputPanel style="display: flex;">
                            <p:commandButton value="Kaydet"
                                             process="@form"
                                             update="@form barnListForm"
                                             styleClass="m-1"
                                             validateClient="true"
                                             action="#{dairyCowBarnController.saveSelectedBarn}"/>
                            <p:commandButton value="Vazgeç"
                                             process="@this"
                                             update="@form"
                                             styleClass="m-1"
                                             resetValues="true"
                                             action="#{dairyCowBarnController.setSelectedBarnView(null)}"/>
                        </p:outputPanel>
                    </p:panelGrid>



                </h:form>
                <br/>
                <p>Sorunuz mu var? <a href="#">Buraya</a> basın ve bize bildirin.</p>
            </div>
        </div>
    </ui:define>
</ui:composition>
