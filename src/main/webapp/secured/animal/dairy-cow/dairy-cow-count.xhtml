<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/templates/template.xhtml">

    <ui:define name="title">Büyükbaş Süt Üretimi</ui:define>

    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="barnId"
                         value="#{dairyCowCountController.barnId}"/>
            <f:viewAction action="#{dairyCowCountController.fillDataTableValues}"/>
        </f:metadata>
    </ui:define>

    <ui:define name="head">
        <style type="text/css">
            .inputMaxWidthClass {
                width: 100%;
            }
            @media (max-width: 640px) {
                .ui-datatable-reflow .ui-datatable-data td[role="gridcell"] .ui-column-title {
                    max-width: unset;
                    width: 100%;
                }
                .steps-desktop {
                    display: none;
                }
            }
        </style>
    </ui:define>

    <ui:define name="content">
        <div class="grid">
            <div class="col">
                <div class="card">
                    <p:steps activeIndex="1">
                        <p:menuitem value="Ahırlar"/>
                        <p:menuitem value="Hayvanlar"/>
                        <p:menuitem value="Yemler"/>
                        <p:menuitem value="Yem rasyonu"/>
                        <p:menuitem value="Giderler"/>
                        <p:menuitem value="Gelirler" containerStyleClass="steps-desktop"/>
                        <p:menuitem value="Sonuçlar" containerStyleClass="steps-desktop"/>
                    </p:steps>
                </div>
            </div>
        </div>
        
        <div class="grid">
            <div class="col">
                <h:form id="countListForm"
                        class="card">
                    <h5 class="mt-0" style="font-weight: bold">Büyükbaş süt hayvanları</h5>

                    <p:growl id="growl"
                             showDetail="true"
                             severity="info warn error">
                        <p:autoUpdate/>
                    </p:growl>

                    <p:dataTable var="cowCount"
                                 stripedRows="true"
                                 size="small"
                                 reflow="true"
                                 editable="true"
                                 value="#{dairyCowCountController.dairyCowCountViewList}">

                        <p:ajax event="rowEditInit" listener="#{dairyCowCountController.onRowEditInit}"/>
                        <p:ajax event="rowEdit" listener="#{dairyCowCountController.onRowEdit}" update="totalCard"/>
                        <p:ajax event="rowEditCancel" listener="#{dairyCowCountController.onRowCancel}"/>

                        <p:column>
                            <h:outputText value="#{msg[cowCount.cowType]}"/>
                        </p:column>
                        <p:column headerText="Hayvan varlığı">
                            <p:cellEditor>
                                <f:facet name="output">
                                    <h:outputText value="#{cowCount.currentCount}"/>
                                </f:facet>
                                <f:facet name="input">
                                    <p:inputNumber value="#{cowCount.currentCount}"
                                                   required="true"
                                                   requiredMessage="Mevcut #{msg[cowCount.cowType]} sayısı giriniz."
                                                   inputStyleClass="inputMaxWidthClass">
                                        <p:ajax listener="#{dairyCowCountController.validateBarnCapacity(cowCount)}"
                                                update="@this"/>
                                    </p:inputNumber>
                                </f:facet>
                            </p:cellEditor>
                        </p:column>
                        <p:column headerText="Alınacak hayvan">
                            <p:cellEditor>
                                <f:facet name="output">
                                    <h:outputText value="#{cowCount.purchaseCount}"/>
                                </f:facet>
                                <f:facet name="input">
                                    <p:inputNumber value="#{cowCount.purchaseCount}"
                                                   inputStyleClass="inputMaxWidthClass"/>
                                </f:facet>
                            </p:cellEditor>
                        </p:column>
                        <p:column headerText="Satılacak hayvan">
                            <p:cellEditor>
                                <f:facet name="output">
                                    <h:outputText value="#{cowCount.sellCount}"/>
                                </f:facet>
                                <f:facet name="input">
                                    <p:inputNumber value="#{cowCount.sellCount}"
                                                   inputStyleClass="inputMaxWidthClass"/>
                                </f:facet>
                            </p:cellEditor>
                        </p:column>
                        <p:column headerText="Yıl sonu">
                            <h:outputText value="#{cowCount.endYearCount}"/>
                        </p:column>
                        <p:column headerText="Ortalama beslenen">
                            <h:outputText value="#{cowCount.averageFeedCount}"/>
                        </p:column>
                        <p:column style="width: calc(56px + 0.5rem)" headerText="Düzenle">
                            <p:rowEditor editTitle="Edit Row"
                                         cancelTitle="Cancel Edit"
                                         saveTitle="Save Row"/>
                        </p:column>
                    </p:dataTable>
                </h:form>
            </div>
        </div>

        <h:form id="totalCard" class="grid">
            <div class="col">
                <div class="card ">
                    <span style="font-weight: bold">
                        Toplam Büyükbaş Hayvan Sayısı:<br/>
                    </span><h:outputText value="#{dairyCowCountController.calculateView.totalCount}"/>

                </div>
            </div>
            <div class="col">
                <div class="card">
                    <span style="font-weight: bold">
                        Ahır Doluluk Oranı:<br/>
                    </span><h:outputText value="#{dairyCowCountController.calculateView.totalBarnUsageRate}"/>
                </div>
            </div>
            <div class="col">
                <div class="card">
                    <span style="font-weight: bold">
                        Yıl Sonu Hayvan Varlığı:<br/>
                    </span><h:outputText value="#{dairyCowCountController.calculateView.endYearTotalCount}"/>
                </div>
            </div>
            <div class="col">
                <div class="card">
                    <span style="font-weight: bold">
                        Yıl Sonu Ahır Doluluk Oranı:<br/>
                    </span><h:outputText value="#{dairyCowCountController.calculateView.endYearBarnUsageRate}"/>
                </div>
            </div>
            <div class="col">
                <div class="card">
                    <span style="font-weight: bold">
                        Yıl İçinde Ortalama Beslenecek Hayvan:<br/>
                    </span><h:outputText value="#{dairyCowCountController.calculateView.endYearTotalFeedCount}"/>
                </div>
            </div>
        </h:form>

        <div class="grid">
            <div class="col">
                <p:outputPanel style="display: flex; justify-content: space-between;">
                    <p:button value="Büyükbaş süt ahırları"
                              styleClass="m-1"
                              iconPos="left"
                              href="/secured/animal/dairy-cow/barn"
                              icon="fa-solid fa-angles-left"/>
                    <p:button value="Büyükbaş süt yemleri"
                              styleClass="m-1"
                              iconPos="right"
                              href="/secured/animal/dairy-cow/feed"
                              icon="fa-solid fa-angles-right">
                        <f:param name="barnId"
                                 value="#{dairyCowCountController.barnId}"/>
                    </p:button>
                </p:outputPanel>
                <br/>
                <p>Sorunuz mu var? <a href="#">Buraya</a> basın ve bize bildirin.</p>
            </div>
        </div>
    </ui:define>
</ui:composition>
