<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/templates/template.xhtml">

    <ui:define name="title">Büyükbaş Süt Üretimi</ui:define>

    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="barnId"
                         value="#{dairyCowFeedRasyonController.barnId}"/>
            <f:viewAction action="#{dairyCowFeedRasyonController.fillDataTableValues}"/>
        </f:metadata>
    </ui:define>

    <ui:define name="head">
        <style type="text/css">
            .inputMaxWidthClass {
                width: 100%;
            }
            @media (max-width: 640px) {
                .ui-datatable-reflow .ui-datatable-data td[role="gridcell"] .ui-column-title {
                    max-width: unset;
                    width: 100%;
                }
                .steps-desktop {
                    display: none;
                }
            }
        </style>
    </ui:define>

    <ui:define name="content">
        <div class="grid">
            <div class="col">
                <div class="card">
                    <p:steps activeIndex="3">
                        <p:menuitem value="Ahırlar" containerStyleClass="steps-desktop"/>
                        <p:menuitem value="Hayvanlar"/>
                        <p:menuitem value="Yemler"/>
                        <p:menuitem value="Yem rasyonu"/>
                        <p:menuitem value="Giderler"/>
                        <p:menuitem value="Gelirler"/>
                        <p:menuitem value="Sonuçlar" containerStyleClass="steps-desktop"/>
                    </p:steps>
                </div>
            </div>
        </div>
        
        <div class="grid">
            <div class="col">
                <h:form id="rasyonListForm"
                        class="card">
                    <h5 class="mt-0" style="font-weight: bold">Büyükbaş süt yem rasyon</h5>

                    <p:growl id="growl"
                             showDetail="true"
                             severity="info warn error">
                        <p:autoUpdate/>
                    </p:growl>

                    <p:focus context="@next"/>

                    <p:dataTable var="feedTable"
                                 reflow="true"
                                 stripedRows="true"
                                 size="small"
                                 widgetVar="feedTableWidget"
                                 editable="true"
                                 value="#{dairyCowFeedRasyonController.dairyCowFeedViewList}">

                        <p:ajax event="rowEditInit" listener="#{dairyCowFeedRasyonController.onRowEditInit}"/>
                        <p:ajax event="rowEdit" listener="#{dairyCowFeedRasyonController.onRowEdit}"/>
                        <p:ajax event="rowEditCancel" listener="#{dairyCowFeedRasyonController.onRowCancel}"/>

                        <p:column headerText="Yem ismi">
                            <h:outputText value="#{feedTable.feed.name}"/>
                        </p:column>
                        <p:column headerText="Laktasyon döneminde günlük ortalama bir hayvana verilen miktar (Kg/Hayvan)">
                            <p:cellEditor>
                                <f:facet name="output">
                                    <h:outputText value="#{feedTable.lactationRasyon}"/>
                                </f:facet>
                                <f:facet name="input">
                                    <p:inputNumber value="#{feedTable.lactationRasyon}"
                                                   inputStyleClass="inputMaxWidthClass"/>
                                </f:facet>
                            </p:cellEditor>
                        </p:column>
                        <p:column headerText="Kuru dödemde günlük ortalama bir hayvana verilen miktar (Kg/Hayvan)">
                            <p:cellEditor>
                                <f:facet name="output">
                                    <h:outputText value="#{feedTable.roughageRasyon}"/>
                                </f:facet>
                                <f:facet name="input">
                                    <p:inputNumber value="#{feedTable.roughageRasyon}"
                                                   inputStyleClass="inputMaxWidthClass"/>
                                </f:facet>
                            </p:cellEditor>
                        </p:column>
                        <p:column style="width: calc(56px + 0.5rem)" headerText="Düzenle">
                            <p:rowEditor editTitle="Edit Row"
                                         cancelTitle="Cancel Edit"
                                         saveTitle="Save Row"/>
                        </p:column>
                    </p:dataTable>
                </h:form>
            </div>
        </div>
        <div class="grid">
            <div class="col">
                <h:form style="display: flex; justify-content: space-between; flex-direction: row-reverse;">
                    <p:commandButton value="Büyükbaş süt işletme giderleri"
                                     process="rasyonListForm"
                                     update="rasyonListForm"
                                     styleClass="m-1"
                                     validateClient="true"
                                     iconPos="right"
                                     action="#{dairyCowFeedRasyonController.nextSaveFeedRasyon}"
                                     icon="fa-solid fa-angles-right"/>
                    <p:commandButton value="Büyükbaş süt yemleri"
                                     process="rasyonListForm"
                                     update="rasyonListForm"
                                     styleClass="m-1"
                                     validateClient="true"
                                     iconPos="left"
                                     action="#{dairyCowFeedRasyonController.backSaveFeedRasyon}"
                                     icon="fa-solid fa-angles-left"/>
                </h:form>
                <br/>
                <p>Sorunuz mu var? <a href="#">Buraya</a> basın ve bize bildirin.</p>
            </div>
        </div>
    </ui:define>
</ui:composition>
