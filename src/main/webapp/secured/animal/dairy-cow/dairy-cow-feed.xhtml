<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/templates/template.xhtml">

    <ui:define name="title">Büyükbaş Süt Üretimi</ui:define>

    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="barnId"
                         value="#{dairyCowFeedController.barnId}"/>
            <f:viewAction action="#{dairyCowFeedController.fillDataTableValues}"/>
        </f:metadata>
    </ui:define>

    <ui:define name="head">
        <style type="text/css">
            .inputMaxWidthClass {
                width: 100%;
            }
            @media (max-width: 640px) {
                .ui-datatable-reflow .ui-datatable-data td[role="gridcell"] .ui-column-title {
                    max-width: unset;
                    width: 100%;
                }
                .steps-desktop {
                    display: none;
                }
            }
        </style>
    </ui:define>

    <ui:define name="content">
        <div class="grid">
            <div class="col">
                <div class="card">
                    <p:steps activeIndex="2">
                        <p:menuitem value="Ahırlar" containerStyleClass="steps-desktop"/>
                        <p:menuitem value="Hayvanlar"/>
                        <p:menuitem value="Yemler"/>
                        <p:menuitem value="Yem rasyonu"/>
                        <p:menuitem value="Giderler"/>
                        <p:menuitem value="Gelirler"/>
                        <p:menuitem value="Sonuçlar" containerStyleClass="steps-desktop"/>
                    </p:steps>
                </div>
            </div>
        </div>
        
        <div class="grid">
            <div class="col">
                <h:form id="feedListForm"
                        class="card">
                    <h5 class="mt-0" style="font-weight: bold">Büyükbaş süt yemleri</h5>

                    <p:growl id="growl"
                             showDetail="true"
                             severity="info warn error">
                        <p:autoUpdate/>
                    </p:growl>

                    <p:dataTable id="dairyCowTable"
                                 var="feedTable"
                                 reflow="true"
                                 stripedRows="true"
                                 size="small"
                                 widgetVar="dairyCowTableWidget"
                                 editable="true"
                                 value="#{dairyCowFeedController.dairyCowFeedViewList}">

                        <p:ajax event="rowEditInit" listener="#{dairyCowFeedController.onRowEditInit}"/>
                        <p:ajax event="rowEdit" listener="#{dairyCowFeedController.onRowEdit}"/>
                        <p:ajax event="rowEditCancel" listener="#{dairyCowFeedController.onRowCancel}"/>

                        <p:column headerText="Yem ismi">
                            <p:cellEditor>
                                <f:facet name="output">
                                    <h:outputText value="#{feedTable.feed.name}"/>
                                </f:facet>
                                <f:facet name="input">
                                    <p:selectOneMenu value="#{feedTable.selectedFeedId}"
                                                     styleClass="inputMaxWidthClass">
                                        <f:selectItem itemLabel="seçiniz"
                                                      itemValue=""/>
                                        <f:selectItems value="#{dairyCowFeedController.feedList}"
                                                       var="feedOption"/>
                                    </p:selectOneMenu>
                                </f:facet>
                            </p:cellEditor>
                        </p:column>
                        <p:column headerText="Miktarı (kg)">
                            <p:cellEditor>
                                <f:facet name="output">
                                    <h:outputText value="#{feedTable.amountKg}"/>
                                </f:facet>
                                <f:facet name="input">
                                    <p:inputNumber value="#{feedTable.amountKg}"
                                                   inputStyleClass="inputMaxWidthClass"/>
                                </f:facet>
                            </p:cellEditor>
                        </p:column>
                        <p:column headerText="Alış tarihi">
                            <p:cellEditor>
                                <f:facet name="output">
                                    <h:outputText value="#{feedTable.buyingDate}"/>
                                </f:facet>
                                <f:facet name="input">
                                    <p:datePicker value="#{feedTable.buyingDate}"
                                                  showTime="false"
                                                  inputStyleClass="inputMaxWidthClass"
                                                  styleClass="inputMaxWidthClass"
                                                  pattern="dd MMMM yyyy"
                                                  mindate="#{dairyCowFeedController.today.minusYears(1)}"
                                                  maxdate="#{dairyCowFeedController.today.plusMonths(1)}"/>
                                </f:facet>
                            </p:cellEditor>
                        </p:column>
                        <p:column headerText="Fiyatı (TL/kg)">
                            <p:cellEditor>
                                <f:facet name="output">
                                    <h:outputText value="#{feedTable.buyingPriceKg}"/>
                                </f:facet>
                                <f:facet name="input">
                                    <p:inputNumber value="#{feedTable.buyingPriceKg}"
                                                   inputStyleClass="inputMaxWidthClass"/>
                                </f:facet>
                            </p:cellEditor>
                        </p:column>

                        <p:column style="width: calc(56px + 0.5rem)" headerText="Düzenle">
                            <p:rowEditor editTitle="Edit Row"
                                         cancelTitle="Cancel Edit"
                                         saveTitle="Save Row"/>
                        </p:column>

                        <p:column headerText="Kaldır" style="width: 51px;text-align: right">
                            <p:commandButton update="dairyCowTable"
                                             styleClass="rounded-button ui-button-danger ui-button-flat"
                                             icon="fa-regular fa-square-minus"
                                             action="#{dairyCowFeedController.deleteUserFeed(feedTable)}"/>
                        </p:column>
                    </p:dataTable>

                    <p:outputPanel style="display: flex;">
                        <p:commandButton value="Yeni yem ekle"
                                         process="@this"
                                         styleClass="m-1"
                                         update="dairyCowTable"
                                         action="#{dairyCowFeedController.onAddNew}"
                                         oncomplete="PF('dairyCowTableWidget').showRowEditors(PF('dairyCowTableWidget').tbody.children().last());"/>
                    </p:outputPanel>
                </h:form>
            </div>
        </div>
        
        <div class="grid">
            <div class="col">
                <p:outputPanel style="display: flex; justify-content: space-between;">
                    <p:button value="Büyükbaş süt sayıları"
                              styleClass="m-1"
                              iconPos="left"
                              href="/secured/animal/dairy-cow/count"
                              icon="fa-solid fa-angles-left">
                        <f:param name="barnId"
                                 value="#{dairyCowFeedController.barnId}"/>
                    </p:button>
                    <p:button value="Büyükbaş süt yem rasyonu"
                              styleClass="m-1"
                              iconPos="right"
                              href="/secured/animal/dairy-cow/feed-rasyon"
                              icon="fa-solid fa-angles-right">
                        <f:param name="barnId"
                                 value="#{dairyCowFeedController.barnId}"/>
                    </p:button>
                </p:outputPanel>
                <br/>
                <p>Sorunuz mu var? <a href="#">Buraya</a> basın ve bize bildirin.</p>
            </div>
        </div>
    </ui:define>
</ui:composition>
