<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/templates/template.xhtml">

    <ui:define name="title">Büyükbaş Süt İşletme Gideri</ui:define>

    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="barnId"
                         value="#{dairyCowIncomeController.barnId}"/>
            <f:viewAction action="#{dairyCowIncomeController.fillDataTableValues}"/>
        </f:metadata>
    </ui:define>

    <ui:define name="content">
        <div class="grid">
            <div class="col">
                <div class="card">
                    <p:steps activeIndex="5">
                        <p:menuitem value="Ahırlar"/>
                        <p:menuitem value="Hayvanlar"/>
                        <p:menuitem value="Yemler"/>
                        <p:menuitem value="Yem rasyonu"/>
                        <p:menuitem value="Giderler"/>
                        <p:menuitem value="Gelirler"/>
                        <p:menuitem value="Sonuçlar"/>
                    </p:steps>
                </div>
            </div>
        </div>
        <div class="grid">
            <div class="col">
                <h:form id="incomeListForm"
                        class="card">
                    <h5 class="mt-0" style="font-weight: bold">Büyükbaş süt gelirleri</h5>

                    <p:growl showDetail="true"
                             severity="info warn">
                        <p:autoUpdate/>
                    </p:growl>

                    <p:focus context="@next"/>

                    <p:dataTable var="incomeTable"
                                 reflow="true"
                                 stripedRows="true"
                                 size="small"
                                 value="#{dairyCowIncomeController.incomeViewList}">
                        <p:column headerText="Gelir soruları">
                            <h:outputText value="#{incomeTable.incomeName}"/>
                        </p:column>

                        <p:column headerText="Değer / Miktar">
                            <p:inputNumber placeholder="incomeValue inputNumber placeholder"
                                           value="#{incomeTable.incomeValue}"
                                           maxValue="999999999999"
                                           minValue="0">
                                <p:ajax process="@this"/>
                            </p:inputNumber>
                        </p:column>
                        <p:column headerText="Birimi">
                            <h:outputText value="#{incomeTable.incomeUnit}"/>
                        </p:column>
                    </p:dataTable>
                </h:form>
            </div>
        </div>
        <div class="grid">
            <div class="col">
                <h:form style="display: flex; justify-content: space-between; flex-direction: row-reverse;">
                    <p:commandButton value="Büyükbaş süt sonuçları"
                                     styleClass="m-1"
                                     iconPos="right"
                                     action="#{dairyCowIncomeController.nextSaveIncome}"
                                     icon="fa-solid fa-angles-right"/>
                    <p:commandButton value="Büyükbaş süt giderler"
                                     styleClass="m-1"
                                     iconPos="left"
                                     action="#{dairyCowIncomeController.backSaveIncome}"
                                     icon="fa-solid fa-angles-left"/>
                </h:form>
                <br/>
                <p>Sorunuz mu var? <a href="#">Buraya</a> basın ve bize bildirin.</p>
            </div>
        </div>
    </ui:define>
</ui:composition>
