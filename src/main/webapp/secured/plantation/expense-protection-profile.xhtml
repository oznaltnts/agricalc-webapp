<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/templates/template.xhtml">

    <ui:define name="title">Bitki Koruma Giderleri</ui:define>

    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="plantationPlanId"
                         value="#{expenseProtectionProfileController.plantationPlanId}"/>
            <f:viewAction action="#{expenseProtectionProfileController.fillExpenseProtectionQuestionList}"/>
        </f:metadata>
    </ui:define>

    <ui:define name="head">
        <style type="text/css">
            .ui-selectmanycheckbox label {
                margin: auto 16px auto 8px;
            }
        </style>
    </ui:define>

    <ui:define name="content">
        <div class="grid">
            <div class="col">
                <div class="card">
                    <p:steps activeIndex="4">
                        <p:menuitem value="Bitkisel demirbaşlar"/>
                        <p:menuitem value="Üretim alanları"/>
                        <p:menuitem value="Üretim planları"/>
                        <p:menuitem value="Gelir bilgileri"/>
                        <p:menuitem value="Gider bilgileri (bitki koruma)"/>
                        <p:menuitem value="Sonuçlar" containerStyleClass="steps-desktop"/>
                    </p:steps>
                </div>
            </div>
        </div>

        <div class="grid">
            <h:form id="updateForm" class="col">
                <p:outputPanel class="card">
                    <p:growl id="growl" showDetail="false" severity="info warn error">
                        <p:autoUpdate/>
                    </p:growl>

                    <h5 class="mt-0" style="font-weight: bold">Bikti koruma gideri bilgileri</h5>

                    <p:focus context="@next"/>

                    <ui:repeat value="#{expenseProtectionProfileController.diseaseQuestionList}"
                               var="disease">
                        <p:panelGrid layout="flex"
                                     rendered="#{disease.plantationQuestion.id ne '194' and disease.plantationQuestion.id ne '196'}"
                                     contentStyleClass="ui-fluid"
                                     columnClasses="col-12 md:col-3 xl:col-3 mt-3, col-12 md:col-9 xl:col-9"
                                     columns="2">
                            <p:outputLabel for="@next"
                                           value="#{disease.plantationQuestion.value}"/>
                            <p:selectManyCheckbox layout="responsive" columns="3" style="width: 100%"
                                                  requiredMessage="#{disease.plantationQuestion.value} seçiniz."
                                                  value="#{disease.selectedAnswerIds}">
                                <p:ajax process="@this" update="selectedDisease"
                                        listener="#{expenseProtectionProfileController.handleDiseaseSelect(disease)}"/>
                                <f:selectItems var="checkboxDisease"
                                               value="#{disease.productQuestionDiseaseList}"
                                               itemValue="#{checkboxDisease.id}"
                                               itemLabel="#{checkboxDisease.disease.name}"/>
                            </p:selectManyCheckbox>
                        </p:panelGrid>

                        <p:outputPanel id="selectedDisease">
                            <ui:repeat value="#{disease.selectedDiseaseList}"
                                       var="selectedDisease">
                                <p:panelGrid layout="flex"
                                             contentStyle="align-items: center;"
                                             contentStyleClass="ui-fluid"
                                             columnClasses="col-12 md:col-3 xl:col-3, col-12 md:col-9 xl:col-9"
                                             columns="4">
                                    <p:outputLabel for="@next"
                                                   value="#{selectedDisease.disease.name}"/>
                                    <p:inputNumber minValue="0"
                                                   required="#{selectedDisease.productQuestion.plantationQuestion.isRequired}"
                                                   requiredMessage="#{selectedDisease.productQuestion.plantationQuestion.value} ilaçlama sayısı giriniz."
                                                   decimalPlaces="0"
                                                   value="#{selectedDisease.integerValue}">
                                        <p:ajax process="@this"/>
                                    </p:inputNumber>

                                </p:panelGrid>
                            </ui:repeat>
                        </p:outputPanel>
                    </ui:repeat>

                    <ui:repeat var="question"
                               value="#{expenseProtectionProfileController.userPlantationPlan.primaryProduct.productQuestionList}">
                        <ui:fragment rendered="#{!question.dontAskAgain}">
                            <p:panelGrid layout="flex"
                                         contentStyle="align-items: center;"
                                         rendered="#{expenseProtectionProfileController.oneRadioRenderer(question) or expenseProtectionProfileController.manyCheckboxRenderer(question) or expenseProtectionProfileController.integerRenderer(question) or expenseProtectionProfileController.decimalRenderer(question)}"
                                         contentStyleClass="ui-fluid"
                                         columnClasses="col-12 md:col-3 xl:col-3, col-12 md:col-9 xl:col-9"
                                         columns="2">
                                <p:outputLabel for="@next"
                                               value="#{question.plantationQuestion.value}"/>
                                <p:outputPanel styleClass="ui-inputgroup" style="justify-content: space-between;">

                                    <p:selectOneRadio required="#{question.plantationQuestion.isRequired}"
                                                      requiredMessage="#{question.plantationQuestion.value} seçiniz."
                                                      layout="responsive" columns="4" style="width: 100%"
                                                      rendered="#{expenseProtectionProfileController.oneRadioRenderer(question)}"
                                                      value="#{question.selectedAnswerId}">
                                        <p:ajax process="@this" update="updateForm"/>
                                        <f:selectItems var="onebutton"
                                                       itemLabel="#{onebutton.value}"
                                                       itemValue="#{onebutton.id}"
                                                       value="#{question.plantationQuestion.questionOptionList}"/>
                                    </p:selectOneRadio>

                                    <p:selectManyCheckbox required="#{question.plantationQuestion.isRequired}"
                                                          requiredMessage="#{question.plantationQuestion.value} seçiniz."
                                                          layout="responsive" columns="4" style="width: 100%"
                                                          rendered="#{expenseProtectionProfileController.manyCheckboxRenderer(question)}"
                                                          value="#{question.selectedAnswerIds}">
                                        <p:ajax process="@this" update="updateForm"/>
                                        <f:selectItems var="checkbox"
                                                       value="#{question.plantationQuestion.questionOptionList}"
                                                       itemLabel="#{checkbox.value}"
                                                       itemValue="#{checkbox.id}"/>
                                    </p:selectManyCheckbox>

                                    <p:inputNumber required="#{question.plantationQuestion.isRequired}"
                                                   requiredMessage="#{question.plantationQuestion.value} giriniz."
                                                   rendered="#{expenseProtectionProfileController.integerRenderer(question)}"
                                                   minValue="0"
                                                   decimalPlaces="0"
                                                   value="#{question.integerValue}">
                                        <p:ajax process="@this"/>
                                    </p:inputNumber>

                                    <p:inputNumber required="#{question.plantationQuestion.isRequired}"
                                                   requiredMessage="#{question.plantationQuestion.value} giriniz."
                                                   rendered="#{expenseProtectionProfileController.decimalRenderer(question)}"
                                                   minValue="0"
                                                   decimalPlaces="2"
                                                   value="#{question.bigDecimalValue}">
                                        <p:ajax process="@this"/>
                                    </p:inputNumber>

                                    <ui:fragment rendered="#{expenseProtectionProfileController.booleanCheckboxRenderer(question)}">
                                        <div class="ui-inputgroup-addon"
                                             style="white-space: nowrap;max-height: 35px;min-width: 140px">
                                            <p:selectBooleanCheckbox value="#{question.dontAskAgain}"
                                                                     itemLabel="Tekrar sorma"/>
                                        </div>
                                    </ui:fragment>
                                </p:outputPanel>

                            </p:panelGrid>
                        </ui:fragment>
                    </ui:repeat>

                    <p style="text-align: right">"Tekrar sorma" seçimleriniz hasat sonuna kadar sorulmaz.</p>
                </p:outputPanel>

                <p:outputPanel style="display: flex; justify-content: space-between; flex-direction: row-reverse;">
                    <p:commandButton value="Sonraki"
                                     process="updateForm"
                                     update="updateForm"
                                     styleClass="m-1"
                                     validateClient="true"
                                     iconPos="right"
                                     action="#{expenseProtectionProfileController.nextSaveExpense}"
                                     icon="fa-solid fa-angles-right"/>
                    <p:commandButton value="Önceki"
                                     process="@this"
                                     styleClass="m-1"
                                     iconPos="left"
                                     action="#{expenseProtectionProfileController.previousSaveExpense}"
                                     icon="fa-solid fa-angles-left"/>
                </p:outputPanel>
                <p>Sorunuz mu var? <a href="#">Buraya</a> basın ve bize bildirin.</p>
            </h:form>
        </div>

    </ui:define>
</ui:composition>
