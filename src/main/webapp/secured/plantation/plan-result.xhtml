<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/templates/template.xhtml">

    <ui:define name="title">Gelir Bilgilerim</ui:define>

    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="parcelPlanId"
                         value="#{planResultController.parcelPlanId}"/>
            <f:viewAction action="#{planResultController.createResultPageValues}"/>
        </f:metadata>
    </ui:define>

    <ui:define name="head">
        <style type="text/css">
        </style>
    </ui:define>

    <ui:define name="content">
        <div class="grid">
            <div class="col">
                <div class="card">
                    <p:steps activeIndex="3">
                        <p:menuitem value="Üretim planları"/>
                        <p:menuitem value="Demirbaş bilgileri"/>
                        <p:menuitem value="Arazi bilgileri"/>
                        <p:menuitem value="Gelir bilgileri"/>
                        <p:menuitem value="Gider bilgileri"/>
                        <p:menuitem value="Sonuçlar" containerStyleClass="steps-desktop"/>
                    </p:steps>
                </div>
            </div>
        </div>

        <div class="grid">
            <div class="col-12 md:col-6 xl:col-6">
                <div class="card">
                    <h5 class="mt-0" style="font-weight: bold">Üretim detayları</h5>
                    <p:panelGrid layout="flex"
                                 contentStyle="align-items: center;"
                                 contentStyleClass="ui-fluid"
                                 columnClasses="col-12 md:col-3 xl:col-2, col-12 md:col-9 xl:col-4, col-12 md:col-3 xl:col-2, col-12 md:col-9 xl:col-4"
                                 columns="4">
                        <p:outputLabel for="@next" value="Ürün:" style="font-weight: bold"/>
                        <p:outputLabel for="@previous" value="#{planResultController.parcelPlan.plantParcel.product.name}"/>

                        <p:outputLabel for="@next" value="Şehir:" style="font-weight: bold"/>
                        <p:outputLabel for="@previous" value="#{planResultController.parcelPlan.plantParcel.city.name}"/>

                        <p:outputLabel for="@next" value="Boyut:" style="font-weight: bold"/>
                        <p:outputLabel for="@previous" value="#{planResultController.parcelPlan.plantParcel.areaDecare} (Dekar)"/>
                    </p:panelGrid>
                </div>
                <div class="card">
                    <h5 class="mt-0" style="font-weight: bold">Gider grafiği</h5>
                    <div style="display: flex; justify-content: center;">
                        <p:chart value="#{planResultController.pieModel}"
                                 style="width: 100%; height: 100%; max-width: 666px;"/>
                    </div>
                </div>
            </div>
            <div class="col-12 md:col-6 xl:col-6">
                <h:form class="card">
                    <h5 class="mt-0" style="font-weight: bold">Gelir detayları</h5>
                    <p:panelGrid layout="flex"
                                 contentStyle="align-items: center;"
                                 contentStyleClass="ui-fluid"
                                 columnClasses="col-12 md:col-3 xl:col-2, col-12 md:col-9 xl:col-4, col-12 md:col-3 xl:col-2, col-12 md:col-9 xl:col-4"
                                 columns="4">
                        <p:outputLabel for="@next" value="Dekar başına brüt gelir:" style="font-weight: bold"/>
                        <p:outputLabel for="@previous" value="#{planResultController.parcelPlan.grossIncome} TL"/>

                        <p:outputLabel for="@next" value="Toplam brüt gelir:" style="font-weight: bold"/>
                        <p:outputLabel for="@previous" value="#{planResultController.parcelPlan.plantParcel.areaDecare * planResultController.parcelPlan.grossIncome} TL"/>

                        <p:outputLabel for="@next" value="Dekar başına brüt gider:" style="font-weight: bold"/>
                        <p:outputLabel for="@previous" value="#{planResultController.parcelPlan.totalExpense} TL"/>

                        <p:outputLabel for="@next" value="Toplam brüt gider:" style="font-weight: bold"/>
                        <p:outputLabel for="@previous" value="#{planResultController.parcelPlan.plantParcel.areaDecare * planResultController.parcelPlan.totalExpense} TL"/>

                        <p:outputLabel for="@next" value="Dekar başına net gelir:" style="font-weight: bold"/>
                        <p:outputLabel for="@previous" value="#{planResultController.parcelPlan.grossIncome - planResultController.parcelPlan.totalExpense} TL"/>

                        <p:outputLabel for="@next" value="Toplam net gelir:" style="font-weight: bold"/>
                        <p:outputLabel for="@previous" value="#{planResultController.parcelPlan.plantParcel.areaDecare * (planResultController.parcelPlan.grossIncome - planResultController.parcelPlan.totalExpense)} TL"/>


                    </p:panelGrid>
                </h:form>
                <h:form class="card">
                    <h5 class="mt-0" style="font-weight: bold">Gider tablosu</h5>
                    <p:dataTable value="#{planResultController.resultShowViewList}"
                                 size="small"
                                 var="result">
                        <p:column headerText="İşlemler" style="background: #{result.costValueHexColor}; color: #000000">
                            <h:outputText value="#{result.costValueName}"/>
                        </p:column>
                        <p:column headerText="Oranı">
                            <h:outputText value="#{result.costValueRate}"/>
                        </p:column>
                        <p:column headerText="Miktarı">
                            <h:outputText value="#{result.costValueCost}"/>
                        </p:column>
                    </p:dataTable>
                </h:form>
            </div>
        </div>

        <div class="grid">
            <h:form class="col">
                <p:outputPanel style="display: flex; justify-content: space-between; flex-direction: row-reverse;">
                    <p:commandButton value="Başa dön"
                                     styleClass="m-1"
                                     validateClient="true"
                                     iconPos="right"
                                     icon="fa-solid fa-angles-right"/>
                    <p:commandButton value="Önceki"
                                     process="@this"
                                     styleClass="m-1"
                                     iconPos="left"
                                     action="#{planResultController.previousSaveExpense}"
                                     icon="fa-solid fa-angles-left"/>
                </p:outputPanel>
                <p>Sorunuz mu var? <a href="#">Buraya</a> basın ve bize bildirin.</p>
            </h:form>
        </div>

    </ui:define>
</ui:composition>
