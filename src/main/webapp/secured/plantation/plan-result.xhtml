<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                template="/templates/template.xhtml">

    <ui:define name="title">Gelir Bilgilerim</ui:define>

    <ui:define name="metadata">
        <f:metadata>
            <f:viewParam name="parcelPlanId"
                         value="#{planResultController.parcelPlanId}"/>
            <f:viewAction action="#{planResultController.fillExpensePackagingQuestionList}"/>
        </f:metadata>
    </ui:define>

    <ui:define name="head">
        <style type="text/css">
        </style>
    </ui:define>

    <ui:define name="content">
        <div class="grid">
            <div class="col">
                <div class="card">
                    <p:steps activeIndex="3">
                        <p:menuitem value="Üretim planları"/>
                        <p:menuitem value="Demirbaş bilgileri"/>
                        <p:menuitem value="Arazi bilgileri"/>
                        <p:menuitem value="Gelir bilgileri"/>
                        <p:menuitem value="Gider bilgileri"/>
                        <p:menuitem value="Sonuçlar" containerStyleClass="steps-desktop"/>
                    </p:steps>
                </div>
            </div>
        </div>

        <div class="grid">
            <h:form id="updateForm" class="col">
                <p:outputPanel class="card">
                    <p:growl id="growl" showDetail="false" severity="info warn error">
                        <p:autoUpdate/>
                    </p:growl>

                    <h5 class="mt-0" style="font-weight: bold">Sonuç profili</h5>

                    <p:chart value="#{planResultController.polarAreaModel}" style="width: 100%; height: 500px;"/>

                </p:outputPanel>

                <p:outputPanel style="display: flex; justify-content: space-between; flex-direction: row-reverse;">
                    <p:commandButton value="Başa dön"
                                     process="updateForm"
                                     update="updateForm"
                                     styleClass="m-1"
                                     validateClient="true"
                                     iconPos="right"
                                     icon="fa-solid fa-angles-right"/>
                    <p:commandButton value="Önceki"
                                     process="@this"
                                     styleClass="m-1"
                                     iconPos="left"
                                     action="#{planResultController.previousSaveExpense}"
                                     icon="fa-solid fa-angles-left"/>
                </p:outputPanel>
                <p>Sorunuz mu var? <a href="#">Buraya</a> basın ve bize bildirin.</p>
            </h:form>
        </div>

    </ui:define>
</ui:composition>
