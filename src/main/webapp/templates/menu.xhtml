<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:p="http://primefaces.org/ui"
                xmlns:sec="https://joinfaces.org/security"
                xmlns:fr="http://primefaces.org/freya">

<div class="menu-wrapper">
    <div class="sidebar-logo">
        <a href="dashboard.xhtml">
            <p:graphicImage name="images/logo-freya-single.svg" library="freya-layout" />
        </a>
        <a href="#" class="sidebar-pin" title="Toggle Menu">
            <span class="pin"></span>
        </a>
    </div>
    <div class="layout-menu-container">
        <h:form id="menuform">
            <fr:menu widgetVar="FreyaMenuWidget">
                <p:menuitem value="Ana sayfa" icon="fa-solid fa-home" url="/"/>
                <p:menuitem value="Nasıl çalışır?" icon="fa-solid fa-question" url="/public/how-it-works"/>
                <p:menuitem value="Hakkımızda" icon="fa-solid fa-circle-info" url="#"/>

                <sec:authorize access="hasAuthority('ADMIN')">
                    <p:menuitem value="Kullanıcılar" icon="fa-solid fa-user-gear" url="/secured/admin/user-management"/>

                    <p:submenu label="Büyükbaş süt yönetimi" icon="fa-solid fa-sliders">
                        <p:menuitem value="Hayvan türleri" icon="fa-solid fa-cow" url="/secured/admin/animal/dairy-cow/cow-management"/>
                        <p:menuitem value="Hayvan katsayıları" icon="fa-solid fa-cow" url="/secured/admin/animal/dairy-cow/cow-coefficient"/>
                        <p:menuitem value="Hayvan yemleri" icon="fa-solid fa-wheat-awn" url="/secured/admin/animal/dairy-cow/feed-management"/>
                        <p:menuitem value="İşletme giderleri" icon="fa-solid fa-wheat-awn" url="/secured/admin/animal/dairy-cow/cost-management"/>
                    </p:submenu>
                </sec:authorize>

                <sec:authorize access="hasAuthority('USER')">
                    <p:menuitem value="Çiftçilik bilgileri" icon="fa-solid fa-user-pen" url="/secured/farmer"/>

                    <p:submenu label="Bitkisel" icon="fa-solid fa-wheat-awn">
                        <p:menuitem value="İşletme bilgileri" icon="fa-solid fa-tractor" url="/secured/plantation/business"/>
                        <p:menuitem value="Arazi bilgileri" icon="fa-solid fa-tractor" url="/secured/plantation/parcel"/>
                        <p:menuitem value="Plan bilgileri" icon="fa-solid fa-tractor" url="/secured/plantation/parcel-plan"/>
                    </p:submenu>

                    <p:submenu label="Hayvansal" icon="fa-solid fa-cow">
                        <p:menuitem value="Büyükbaş süt" icon="fa-solid fa-building-wheat" url="/secured/animal/dairy-cow/barn"/>
                    </p:submenu>
                </sec:authorize>
            </fr:menu>
        </h:form>
    </div>
</div>

</ui:composition>
